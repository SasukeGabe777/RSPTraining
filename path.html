<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Learner Path · RSP Training Portal</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F172A; --bg-2:#1E293B;
    --bolt:#FACC15; --bolt-deep:#CA8A04;
    --path:#8B5CF6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    background:radial-gradient(circle at top right,#1E293B 0%,#0F172A 70%);
    font-family:'Inter',system-ui,sans-serif;color:#fff;min-height:100vh;
  }
  h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;line-height:1.05;letter-spacing:-.01em}
  .wrap{max-width:1280px;margin:0 auto;padding:40px 32px}
  .topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
  .pretitle{color:var(--bolt);font-size:11px;letter-spacing:.18em;font-weight:800}
  .topbar h1{font-size:44px;color:#fff;margin-top:4px}
  .tagline{color:#CBD5E1;margin-top:6px;max-width:640px;line-height:1.5}

  /* User pill */
  .user-pill{
    background:linear-gradient(135deg,#1E293B,#0F172A);
    border:2px solid #334155;border-radius:14px;padding:14px 18px;
    display:flex;align-items:center;gap:14px;min-width:260px;
  }
  .user-avatar{width:48px;height:48px;border-radius:50%;flex:0 0 48px;overflow:hidden;background:#0F172A}
  .user-avatar svg{display:block;width:100%;height:100%}
  .user-name{font-weight:800;font-size:14px;color:#fff}
  .user-meta{font-size:11px;color:#94A3B8;margin-top:1px}
  .user-role{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;letter-spacing:.05em;margin-top:4px;background:#0F172A;border:1px solid var(--path);color:#C4B5FD}
  .user-actions{margin-left:auto;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
  .user-actions a{color:#64748B;font-size:11px;text-decoration:none}
  .user-actions a:hover{color:var(--bolt)}

  /* Top nav */
  .topnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .nav-link{padding:8px 14px;border-radius:8px;background:#1E293B;color:#94A3B8;text-decoration:none;font-weight:700;font-size:12px;letter-spacing:.05em;border:1px solid #334155}
  .nav-link:hover{background:#334155;color:#fff}
  .nav-link.active{background:#FACC15;color:#0F172A;border-color:#FACC15}

  /* Path header banner */
  .path-banner{
    --accent:var(--path);
    margin-top:30px;background:linear-gradient(135deg,#1E293B,#0F172A);
    border:2px solid #334155;border-radius:20px;padding:26px 28px;
    display:flex;align-items:center;gap:24px;flex-wrap:wrap;position:relative;overflow:hidden;
  }
  .path-banner::before{
    content:"";position:absolute;left:0;top:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--accent),transparent 85%);
  }
  .path-ico{
    width:64px;height:64px;border-radius:18px;display:grid;place-items:center;
    font-size:32px;background:rgba(15,23,42,.82);box-shadow:inset 0 0 0 1px var(--accent);flex:0 0 64px;
  }
  .path-stat .label{color:#94A3B8;font-size:10px;letter-spacing:.18em;font-weight:800}
  .path-stat .num{font-family:'Bricolage Grotesque';font-size:38px;font-weight:800;color:var(--accent);line-height:1}
  .path-stat .small{color:#475569;font-size:17px;font-weight:600}
  .path-bar{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px}
  .path-bar .meta{color:#94A3B8;font-size:11px;font-weight:600;display:flex;justify-content:space-between}
  .path-bar .track{background:#1E293B;height:14px;border-radius:7px;overflow:hidden;border:1px solid #334155}
  .path-bar .fill{height:100%;background:linear-gradient(90deg,var(--accent),rgba(255,255,255,.25));transition:width .5s ease}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .chip{padding:5px 12px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.06em;border:1px solid #334155;background:#1E293B;color:#94A3B8}
  .chip.role{background:rgba(139,92,246,.14);color:#C4B5FD;border-color:rgba(139,92,246,.5)}
  .chip.assigned{background:#065F46;color:#A7F3D0;border-color:#065F46}
  .chip.done{background:#065F46;color:#A7F3D0;border-color:#065F46}

  /* Next-up callout */
  .next-up{
    margin-top:22px;padding:18px 22px;border-radius:16px;
    background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.3);
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  }
  .next-up .eyebrow{color:#C4B5FD;font-size:10px;font-weight:800;letter-spacing:.16em}
  .next-up .title{color:#fff;font-weight:800;font-size:17px;margin-top:4px}
  .next-up .sub{color:#94A3B8;font-size:12px;margin-top:2px}
  .btn{
    display:inline-flex;align-items:center;padding:11px 22px;border-radius:10px;
    font-weight:800;font-size:13px;font-family:inherit;text-decoration:none;
    cursor:pointer;border:none;letter-spacing:.04em;transition:all .15s;
  }
  .btn.primary{background:linear-gradient(135deg,var(--bolt),var(--bolt-deep));color:#0F172A}
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(250,204,21,.3)}

  /* Module list */
  .section{margin-top:34px}
  .section-head{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid rgba(51,65,85,.85);
  }
  .section-head h2{font-size:22px;color:#fff}
  .section-head .count{
    color:#CBD5E1;font-size:11px;font-weight:800;letter-spacing:.1em;
    padding:9px 12px;border-radius:999px;background:rgba(15,23,42,.82);border:1px solid rgba(71,85,105,.9);
  }

  .step-list{display:flex;flex-direction:column;gap:12px}
  .step{
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;
    padding:16px 20px;border-radius:16px;text-decoration:none;color:#fff;
    background:linear-gradient(160deg,#1E293B,#0F172A);border:2px solid #334155;
    transition:all .18s ease;position:relative;overflow:hidden;
  }
  .step:hover{transform:translateX(3px);border-color:var(--bolt)}
  .step.completed{border-color:#10B981}
  .step.locked{opacity:.5;pointer-events:none}
  .step-num{
    width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
    font-family:'Bricolage Grotesque';font-weight:800;font-size:17px;
    background:rgba(15,23,42,.9);border:1px solid #334155;color:#94A3B8;flex:0 0 44px;
  }
  .step.completed .step-num{background:#065F46;border-color:#065F46;color:#A7F3D0}
  .step.locked .step-num{color:#64748B}
  .step-body{min-width:0}
  .step-body .meta{color:#64748B;font-size:11px;font-weight:700;letter-spacing:.05em;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .step-body h3{font-size:16px;color:#fff;margin-top:4px;line-height:1.3}
  .step-body .desc{color:#94A3B8;font-size:12px;line-height:1.45;margin-top:4px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .step-body .lock-note{color:#FCA5A5;font-size:11px;font-weight:700;margin-top:5px}
  .step-right{text-align:right;flex:0 0 auto}
  .step-badge{font-size:11px;font-weight:800;padding:5px 11px;border-radius:999px;letter-spacing:.05em;display:inline-block}
  .badge-completed{background:#065F46;color:#A7F3D0}
  .badge-progress{background:#1E40AF;color:#BFDBFE}
  .badge-new{background:#FACC15;color:#0F172A}
  .badge-locked{background:rgba(15,23,42,.85);color:#64748B}
  .step-xp{color:#64748B;font-size:11px;font-weight:700;margin-top:6px}
  .hub-tag{padding:2px 8px;border-radius:999px;background:rgba(15,23,42,.9);border:1px solid #334155;font-size:10px}

  .empty{text-align:center;padding:60px 20px;color:#64748B}
  .empty .ico{font-size:64px;margin-bottom:14px}
  .empty h3{color:#CBD5E1;font-size:20px}
  .empty p{margin-top:8px;font-size:13px}

  .footer{margin-top:60px;padding:24px 0;border-top:1px solid #1E293B;color:#475569;font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
  @media(max-width:640px){
    .step{grid-template-columns:auto 1fr;gap:14px}
    .step-right{grid-column:2;text-align:left}
  }
</style>
<link rel="stylesheet" href="brand.css">
</head>
<body>

<div class="wrap" id="portal">
  <div class="topbar">
    <div>
      <img class="rsp-brand-logo" src="images/rsp-industrial-logo.png" alt="RSP Industrial">
      <div class="pretitle" id="crumbBar">RSP INDUSTRIAL · TRAINING PORTAL</div>
      <h1 id="pathTitle">Learner Path</h1>
      <p class="tagline" id="pathDesc"></p>
      <div class="topnav">
        <a class="nav-link" href="index.html">🏠 All Hubs</a>
        <a class="nav-link" href="badges.html">🏅 Badges</a>
        <a class="nav-link" href="mastery.html">🏆 Mastery</a>
        <a class="nav-link" href="team.html">🤝 Team</a>
        <a class="nav-link active" href="#" id="pathNavLink">🎯 Path</a>
      </div>
    </div>
    <div class="user-pill">
      <div class="user-avatar" id="userAvatar"></div>
      <div>
        <div class="user-name" id="userName">—</div>
        <div class="user-meta" id="userMeta">—</div>
        <div class="user-role" id="userRole" style="display:none"></div>
      </div>
      <div class="user-actions">
        <a href="index.html">Back to hubs</a>
        <a href="#" id="logoutLink">Log out</a>
      </div>
    </div>
  </div>

  <div id="pathBody"></div>

  <div class="footer">
    <div>RSP Industrial · Training Portal</div>
    <div><a href="index.html" style="color:#64748B;text-decoration:none">← All hubs</a></div>
  </div>
</div>

<script src="manifest.js"></script>
<script src="avatars.js"></script>
<script src="badges.js"></script>
<script src="paths.js"></script>
<script src="config.local.js"></script>
<script src="cloud.js"></script>
<script>
(function(){
  const KEY_USER='rsp_user', KEY_LEDGER='rsp_ledger';
  function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

  let user=null;
  try{ user=JSON.parse(lsGet(KEY_USER)||'null'); }catch(e){}
  if(!user){ location.href='index.html'; return; }

  const manifest=window.RSP_MANIFEST;
  const esc=manifest.escapeHtml;
  const params=new URLSearchParams(location.search);
  const pathId=params.get('id');

  let moduleConfigs=manifest.readModuleConfigCache?manifest.readModuleConfigCache():{};
  let paths=window.RSPPaths.readCache();
  let ledger={};

  function isAdmin(){ return manifest.isAdminUser(user); }
  function learnerModules(){
    const entry=ledger[user.name];
    return (entry&&entry.modules)||{};
  }

  function loadLedger(){
    try{ ledger=JSON.parse(lsGet(KEY_LEDGER)||'{}'); }catch(e){ ledger={}; }
  }

  function moduleStatus(mod){
    const p=learnerModules()[mod.id];
    if(!p) return 'new';
    if(p.completedAt) return 'completed';
    if(p.attempts||p.openedAt||(p.totalXP||0)>0) return 'progress';
    return 'new';
  }

  /**
   * A module in a path answers to BOTH gates: the path's own sequential
   * chain and whatever prerequisite its home hub already imposes. A path
   * can add a lock but never removes one, so a learner can't slip past an
   * Onboarding prerequisite by entering through a path. Admins bypass both.
   */
  function moduleLock(resolved, mod){
    if(isAdmin()) return {locked:false};
    const mine=learnerModules();
    const fromPath=window.RSPPaths.pathLock(resolved, mod.id, mine);
    if(fromPath.locked) return fromPath;
    const hubList=manifest.hubModulesSorted(mod.hub, moduleConfigs);
    const hubPrereqId=manifest.effectivePrerequisite(mod, hubList, moduleConfigs);
    if(hubPrereqId){
      const rec=mine[hubPrereqId];
      if(!rec||!rec.completedAt){
        const prereq=hubList.find(function(m){return m.id===hubPrereqId});
        const hubCfg=(window.RSP_HUBS&&window.RSP_HUBS[mod.hub])||{};
        return {locked:true, reason:'Complete "'+((prereq&&prereq.name)||hubPrereqId)+'" in '+(hubCfg.shortLabel||'its hub')+' first'};
      }
    }
    return {locked:false};
  }

  function renderUser(){
    document.getElementById('userName').textContent=user.name;
    document.getElementById('userMeta').textContent=user.id||'No ID provided';
    const av=document.getElementById('userAvatar');
    if(user.avatar&&window.renderAvatar) av.innerHTML=window.renderAvatar(user.avatar,48);
    else av.textContent=(user.name.trim().charAt(0).toUpperCase()||'?');
    const mine=window.RSPPaths.assignedPaths(user,paths);
    const roleEl=document.getElementById('userRole');
    if(isAdmin()){
      roleEl.style.display='inline-block';
      roleEl.style.borderColor='#FACC15';roleEl.style.color='#FACC15';
      roleEl.textContent='🛡️ ADMIN MODE';
    } else if(mine.length){
      roleEl.style.display='inline-block';
      roleEl.textContent=mine.map(function(p){return p.icon+' '+p.label}).join(' · ');
    } else {
      roleEl.style.display='none';
    }
  }

  function renderNotFound(){
    document.getElementById('pathTitle').textContent='Path not found';
    document.getElementById('pathDesc').textContent='';
    document.getElementById('pathBody').innerHTML=
      '<div class="empty"><div class="ico">🧭</div><h3>This path isn’t available</h3>'+
      '<p>It may have been renamed or removed. Head back to the hubs to keep training.</p>'+
      '<p style="margin-top:16px"><a class="btn primary" href="index.html">← Back to hubs</a></p></div>';
  }

  function render(){
    const path=window.RSPPaths.findPath(paths,pathId);
    if(!path){ renderNotFound(); return; }

    document.title=path.label+' · RSP Training Portal';
    const accent=path.accent||'#8B5CF6';
    document.getElementById('pathTitle').textContent=path.label;
    document.getElementById('pathDesc').textContent=path.description||'';
    document.getElementById('pathNavLink').textContent=(path.icon||'🎯')+' '+path.label;
    document.getElementById('crumbBar').innerHTML=
      '<a href="index.html" style="color:inherit;text-decoration:none;opacity:.75">RSP Training Portal</a>'+
      '<span style="opacity:.5;margin:0 6px">▸</span><span>'+esc(path.label)+'</span>';

    const resolved=window.RSPPaths.resolvePath(path,moduleConfigs,{includeUnpublished:isAdmin()});
    const mine=learnerModules();
    const progress=window.RSPPaths.pathProgress(resolved,mine);
    const assigned=window.RSPPaths.rolesOf(user).indexOf(path.id)!==-1;

    if(!resolved.modules.length){
      document.getElementById('pathBody').innerHTML=
        '<div class="empty"><div class="ico">'+esc(path.icon||'🎯')+'</div><h3>No modules in this path yet</h3>'+
        '<p>An admin hasn’t added any training to '+esc(path.label)+' so far. Check back soon.</p></div>';
      return;
    }

    let html='';

    // ── banner ──
    html+='<div class="path-banner" style="--accent:'+esc(accent)+'">'+
      '<div class="path-ico">'+esc(path.icon||'🎯')+'</div>'+
      '<div class="path-stat"><div class="label">COMPLETED</div>'+
        '<div><span class="num">'+progress.completed+'</span> <span class="small">/ '+progress.total+'</span></div></div>'+
      '<div class="path-stat"><div class="label">XP EARNED</div>'+
        '<div><span class="num">'+progress.earnedXP+'</span> <span class="small">/ '+progress.availableXP+'</span></div></div>'+
      '<div class="path-bar">'+
        '<div class="meta"><span>'+(progress.complete?'Path complete':'Path progress')+'</span><span>'+progress.pct+'%</span></div>'+
        '<div class="track"><div class="fill" style="width:'+progress.pct+'%"></div></div>'+
      '</div>'+
    '</div>';

    // ── chips ──
    html+='<div class="chips">';
    if(path.is_role) html+='<span class="chip role">ROLE PATH</span>';
    if(assigned) html+='<span class="chip assigned">✓ ASSIGNED TO YOU</span>';
    if(path.sequential) html+='<span class="chip">🔒 STEP BY STEP</span>';
    if(progress.complete) html+='<span class="chip done">🎉 COMPLETE</span>';
    html+='<span class="chip">'+progress.remaining+' REMAINING</span>';
    html+='</div>';

    // ── next up ──
    if(progress.nextModule){
      const next=progress.nextModule;
      const lock=moduleLock(resolved,next);
      html+='<div class="next-up">'+
        '<div>'+
          '<div class="eyebrow">'+(lock.locked?'NEXT IN THIS PATH':'PICK UP WHERE YOU LEFT OFF')+'</div>'+
          '<div class="title">'+esc(next.icon)+' '+esc(next.name)+'</div>'+
          '<div class="sub">'+(lock.locked?esc(lock.reason):('~'+esc(next.estTime)+' min · '+esc(next.xp)+' XP'))+'</div>'+
        '</div>'+
        (lock.locked?'':'<a class="btn primary" href="'+esc(next.path)+'">Continue →</a>')+
      '</div>';
    }

    // ── steps ──
    html+='<div class="section"><div class="section-head">'+
      '<h2>'+(path.sequential?'Your steps':'Modules in this path')+'</h2>'+
      '<span class="count">'+progress.completed+' / '+progress.total+' COMPLETED</span>'+
    '</div><div class="step-list">';

    resolved.modules.forEach(function(mod,i){
      const status=moduleStatus(mod);
      const lock=moduleLock(resolved,mod);
      const record=mine[mod.id]||{};
      const hubCfg=(window.RSP_HUBS&&window.RSP_HUBS[mod.hub])||{};
      let badge;
      if(lock.locked) badge='<span class="step-badge badge-locked">🔒 LOCKED</span>';
      else if(status==='completed') badge='<span class="step-badge badge-completed">✓ DONE</span>';
      else if(status==='progress') badge='<span class="step-badge badge-progress">'+(record.bestPct?('Best: '+record.bestPct+'%'):'In progress')+'</span>';
      else badge='<span class="step-badge badge-new">START</span>';

      html+='<a class="step '+status+(lock.locked?' locked':'')+'" href="'+(lock.locked?'#':esc(mod.path))+'">'+
        '<div class="step-num">'+(status==='completed'?'✓':(i+1))+'</div>'+
        '<div class="step-body">'+
          '<div class="meta">'+
            '<span class="hub-tag">'+esc(hubCfg.icon||'📘')+' '+esc(hubCfg.shortLabel||mod.hub)+'</span>'+
            '<span>'+esc(mod.category)+'</span>'+
          '</div>'+
          '<h3>'+esc(mod.icon)+' '+esc(mod.name)+'</h3>'+
          '<p class="desc">'+esc(mod.description)+'</p>'+
          (lock.locked?'<div class="lock-note">🔒 '+esc(lock.reason)+'</div>':'')+
        '</div>'+
        '<div class="step-right">'+badge+'<div class="step-xp">~'+esc(mod.estTime)+' min · '+esc(mod.xp)+' XP</div></div>'+
      '</a>';
    });
    html+='</div></div>';

    // Admin-only: stale ids that no longer resolve to a module.
    if(isAdmin()&&resolved.missingIds.length){
      html+='<div class="section"><div class="next-up" style="background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3)">'+
        '<div><div class="eyebrow" style="color:#FCA5A5">🛡 ADMIN · '+resolved.missingIds.length+' UNRESOLVED MODULE'+(resolved.missingIds.length===1?'':'S')+'</div>'+
        '<div class="sub">These ids are still on the path but no longer match a module: '+esc(resolved.missingIds.join(', '))+
        '. Learners don’t see them and they don’t count toward progress. Remove them in the admin Paths tab.</div></div></div></div>';
    }

    document.getElementById('pathBody').innerHTML=html;
  }

  document.getElementById('logoutLink').addEventListener('click',function(e){
    e.preventDefault();
    if(confirm('Log out? Your progress is saved on this device under your name.')){
      lsDel(KEY_USER); location.href='index.html';
    }
  });

  async function init(){
    loadLedger();
    renderUser();
    render();
    if(!(window.RSPCloud&&window.RSPCloud.isConfigured)) return;
    const configSync=manifest.loadModuleConfigs({current:moduleConfigs})
      .then(function(map){ moduleConfigs=map; })
      .catch(function(e){ console.warn('Module config refresh failed; using last-known-good configuration:',e); });
    const pathSync=window.RSPPaths.loadPaths({current:paths})
      .then(function(rows){ paths=rows; })
      .catch(function(e){ console.warn('Path refresh failed; using last-known-good paths:',e); });
    const progressSync=(async function(){
      await window.RSPCloud.syncDown(user.name);
      try{ const u=JSON.parse(lsGet(KEY_USER)||'null'); if(u) user=u; }catch(e){}
      loadLedger();
    })().catch(function(e){ console.warn('Cloud sync failed (page still works locally):',e); });
    await Promise.all([configSync,pathSync,progressSync]);
    renderUser();
    render();
  }

  init();
})();
</script>
</body>
</html>
